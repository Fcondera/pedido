<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18352b">
  <title>Um convite especial</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      background: #18352b;
      color: #fffdf6;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        linear-gradient(115deg, rgba(14, 35, 27, .28), rgba(18, 34, 27, .48)),
        url("pedidoo/WhatsApp Image 2026-10-02 at 19.45.06.jpeg") center 52% / cover no-repeat fixed,
        radial-gradient(ellipse at 22% 16%, #6d8062 0, transparent 44%),
        linear-gradient(145deg, #52644d, #18352b 62%, #392b20);
    }

    body::before {
      position: fixed;
      inset: 0;
      content: "";
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 20%, rgba(9, 20, 15, .42) 100%);
    }

    main {
      position: relative;
      width: min(100% - 36px, 620px);
      padding: 64px 32px 56px;
      text-align: center;
      animation: arrive 800ms cubic-bezier(.2, .75, .2, 1) both;
    }

    h1 {
      max-width: 560px;
      margin: 0 auto;
      font-size: 54px;
      font-weight: 400;
      line-height: 1.08;
      text-wrap: balance;
      text-shadow: 0 3px 30px rgba(0, 0, 0, .25);
    }

    .actions {
      position: relative;
      width: min(100%, 360px);
      height: 66px;
      margin: 28px auto 0;
    }

    .choice {
      position: absolute;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 142px;
      height: 54px;
      padding: 0 25px;
      border: 1px solid transparent;
      border-radius: 3px;
      font: 600 15px/1 Arial, sans-serif;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    button:focus-visible, a:focus-visible {
      outline: 3px solid #f0d89f;
      outline-offset: 4px;
    }

    #yes {
      left: 0;
      color: #18352b;
      background: #f0d89f;
    }

    #yes:hover { background: #fff0c8; transform: translateY(-2px); }

    #no {
      right: 0;
      color: #fffdf6;
      border-color: rgba(255, 253, 246, .68);
      background: rgba(13, 30, 23, .3);
      transition: left 240ms ease, background-color 160ms ease, color 160ms ease;
    }

    #no.fleeing {
      animation: flee-vertically 1100ms linear infinite;
    }

    @keyframes arrive {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes flee-vertically {
      0%, 49.9% { top: 12px; }
      50%, 100% { top: calc(100vh - 66px); }
    }

    @media (max-width: 520px) {
      main { padding: 48px 10px 40px; }
      h1 { font-size: 42px; }
      .actions { width: min(100%, 320px); }
      .choice { min-width: 128px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      #no.fleeing { animation: none; top: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Vamos lá na choperia?</h1>

    <div class="actions" id="actions" aria-label="Responda ao convite">
      <a class="choice" id="yes" href="https://youtu.be/_jWVFYZF1u4?si=VhTqu7--GT9XF2jW" target="_blank" rel="noopener noreferrer" aria-label="Sim, abrir a música no YouTube">Sim</a>
      <button class="choice" id="no" type="button">Não</button>
    </div>
  </main>

  <script>
    const noButton = document.querySelector("#no");

    function dodgeNo() {
      if (noButton.classList.contains("fleeing")) return;

      const initialPosition = noButton.getBoundingClientRect();
      noButton.style.position = "fixed";
      noButton.style.left = `${initialPosition.left}px`;
      noButton.style.top = "12px";

      const maxX = Math.max(12, window.innerWidth - noButton.offsetWidth - 12);
      noButton.style.zIndex = "2";
      noButton.style.right = "auto";
      noButton.style.left = `${12 + Math.random() * (maxX - 12)}px`;
      noButton.classList.add("fleeing");
    }

    function startFleeing() {
      dodgeNo();
    }

    noButton.addEventListener("pointerenter", startFleeing);
    noButton.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      startFleeing();
    });
    noButton.addEventListener("click", (event) => {
      event.preventDefault();
    });
    noButton.addEventListener("focus", startFleeing);
  </script>
</body>
</html>
